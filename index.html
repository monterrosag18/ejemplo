<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Sistema de autenticacion - CRUDZASO -->
</head>
<body class="auth-page">
    <!-- Main Container -->
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <!-- Login Card -->
        <div class="card shadow-lg border-0" style="max-width: 480px; width: 100%; border-radius: 16px;">
            <div class="card-body p-5">
                <!-- Logo Section -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px;">
                        <i class="bi bi-bookmark-fill text-white" style="font-size: 2rem;"></i>
                    </div>
                    <h1 class="fw-bold fs-3 mb-0">CRUDZASO</h1>
                </div>

                <!-- Welcome Text -->
                <div class="text-center mb-4">
                    <h2 class="h4 fw-semibold mb-2">Welcome back</h2>
                    <p class="text-muted small">Enter your credentials to access the platform</p>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email or username</label>
                        <input type="text" class="form-control form-control-lg" id="email" 
                               placeholder="student@university.edu" required>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password" 
                                   placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="text-end mt-2">
                            <a href="#" class="text-decoration-none small text-primary">Forgot password?</a>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
                        Sign in
                    </button>

                    <!-- Register Link -->
                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="pages/register.html" class="text-decoration-none fw-medium ms-1">Register</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <!-- Login Script -->
    <script src="assets/js/login.js"></script>
</body>
</html>
