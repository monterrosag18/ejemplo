<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - My Profile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- Perfil de Usuario - CRUDZASO -->
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px; background: #3b4351; border-radius: 10px;">
                    <i class="bi bi-bookmark-fill text-white"></i>
                </div>
                <span class="fw-bold">CRUDZASO</span>
            </a>

            <!-- Right Side -->
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark me-3" type="button">
                    <i class="bi bi-bell"></i>
                </button>
                <div class="dropdown">
                    <button class="btn btn-link text-dark dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown">
                        <img id="navAvatar" src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff" class="rounded-circle me-2" width="32" height="32" alt="User">
                        <div class="text-start d-none d-md-block">
                            <div class="small fw-semibold" id="navUserName">Loading...</div>
                            <div class="text-muted" style="font-size: 0.75rem;" id="navUserRole">User</div>
                        </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="../index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block bg-light sidebar py-3">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" href="dashboard.html">
                                <i class="bi bi-grid me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" href="tasks.html">
                                <i class="bi bi-check2-square me-2"></i>
                                My Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active d-flex align-items-center" href="profile.html">
                                <i class="bi bi-person me-2"></i>
                                Profile
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Content Area -->
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                <!-- Page Header -->
                <div class="mb-4">
                    <h1 class="h3 fw-bold">My Profile</h1>
                </div>

                <div class="row">
                    <!-- Left Column - Profile Card -->
                    <div class="col-lg-4 mb-4">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body text-center p-4">
                                <!-- Profile Picture -->
                                <div class="mb-3">
                                    <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff" 
                                         class="rounded-circle" width="120" height="120" alt="Profile">
                                </div>

                                <!-- Name and Role -->
                                <h4 class="fw-bold mb-1" id="profileName">Loading...</h4>
                                <span class="badge bg-primary mb-3" id="profileRole">User</span>

                                <!-- Email -->
                                <div class="d-flex align-items-center justify-content-center text-muted mb-4">
                                    <i class="bi bi-envelope me-2"></i>
                                    <span id="profileEmail">Loading...</span>
                                </div>

                                <!-- Stats -->
                                <div class="border-top pt-3">
                                    <h2 class="fw-bold mb-0" id="profileTaskCount">0</h2>
                                    <p class="text-muted mb-0">Tasks</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column - Personal Information -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <!-- Header -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="fw-bold mb-0">Personal Information</h5>
                                    <button class="btn btn-link text-decoration-none" id="editProfileBtn">
                                        <i class="bi bi-pencil me-1"></i>Edit Profile
                                    </button>
                                </div>

                                <!-- Information Grid -->
                                <div class="row g-4">
                                    <!-- Full Name -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Full Name</label>
                                            <p class="fw-medium mb-0" id="infoFullName">Loading...</p>
                                        </div>
                                    </div>

                                    <!-- Employee ID -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Student/Employee ID</label>
                                            <p class="fw-medium mb-0" id="infoEmployeeId">Loading...</p>
                                        </div>
                                    </div>

                                    <!-- Phone -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Phone</label>
                                            <p class="fw-medium mb-0" id="infoPhone">Loading...</p>
                                        </div>
                                    </div>

                                    <!-- Department -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Department</label>
                                            <p class="mb-0">
                                                <span class="badge bg-warning text-dark" id="infoDepartment">Loading...</span>
                                            </p>
                                        </div>
                                    </div>

                                    <!-- Role Level -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Academic/Role Level</label>
                                            <p class="fw-medium mb-0" id="infoRoleLevel">Loading...</p>
                                        </div>
                                    </div>

                                    <!-- Join Date -->
                                    <div class="col-md-6">
                                        <div>
                                            <label class="text-muted small mb-1">Join Date</label>
                                            <p class="fw-medium mb-0" id="infoJoinDate">Loading...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Edit Form (Hidden by default) -->
                        <div class="card border-0 shadow-sm mt-4" id="editFormCard" style="display: none;">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-4">Edit Profile Information</h5>
                                <form id="edit-profile-form">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="editFullName" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Phone</label>
                                            <input type="tel" class="form-control" id="editPhone" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" id="editEmail" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Department</label>
                                            <select class="form-select" id="editDepartment">
                                                <option>Computer Science</option>
                                                <option>Mathematics</option>
                                                <option>Physics</option>
                                                <option>Administration</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Bio</label>
                                            <textarea class="form-control" id="editBio" rows="3"></textarea>
                                        </div>
                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary me-2">Save Changes</button>
                                            <button type="button" class="btn btn-outline-secondary" id="cancelEditBtn">Cancel</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <!-- Profile Script -->
    <script src="../assets/js/profile.js"></script>
</body>
</html>
