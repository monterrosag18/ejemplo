<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - Create Task</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- Crear Nueva Tarea - CRUDZASO -->
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px; background: #3b4351; border-radius: 10px;">
                    <i class="bi bi-bookmark-fill text-white"></i>
                </div>
                <span class="fw-bold">CRUDZASO</span>
            </a>

            <!-- Breadcrumb -->
            <div class="d-none d-md-flex align-items-center ms-4">
                <i class="bi bi-arrow-left me-2 text-primary" style="cursor: pointer;" onclick="window.history.back()"></i>
                <a href="tasks.html" class="text-decoration-none text-muted me-2">Back to Tasks</a>
                <i class="bi bi-chevron-right text-muted mx-2 small"></i>
                <span class="text-muted">Create New</span>
            </div>

            <!-- Right Side -->
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-link text-dark me-3" type="button">
                    <i class="bi bi-bell"></i>
                </button>
                <div class="dropdown">
                    <button class="btn btn-link text-dark dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown">
                        <img id="navAvatar" src="https://ui-avatars.com/api/?name=User&background=2563eb&color=fff" class="rounded-circle me-2" width="32" height="32" alt="User">
                        <div class="text-start d-none d-md-block">
                            <div class="small fw-semibold" id="navUserName">Loading...</div>
                            <div class="text-muted" style="font-size: 0.75rem;" id="navUserRole">User</div>
                        </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="../index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Page Header -->
                <div class="mb-4">
                    <h1 class="h3 fw-bold mb-2">Create New Task</h1>
                    <p class="text-muted mb-0">Fill in the details below to create a new academic task</p>
                </div>

                <!-- Create Task Form -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form id="create-task-form">
                            <!-- Task Title -->
                            <div class="mb-4">
                                <label for="taskTitle" class="form-label fw-medium">Task Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="taskTitle" 
                                       placeholder="e.g., Complete Quarter 3 Report" required>
                            </div>

                            <!-- Category and Priority Row -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="category" class="form-label fw-medium">Category</label>
                                    <select class="form-select" id="category" required>
                                        <option value="" selected>Select category...</option>
                                        <option value="Mathematics">Mathematics</option>
                                        <option value="Physics">Physics</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="History">History</option>
                                        <option value="Literature">Literature</option>
                                        <option value="Chemistry">Chemistry</option>
                                        <option value="Biology">Biology</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="priority" class="form-label fw-medium">Priority</label>
                                    <select class="form-select" id="priority" required>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="High">High</option>
                                        <option value="Low">Low</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Status and Due Date Row -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="status" class="form-label fw-medium">Status</label>
                                    <select class="form-select" id="status" required>
                                        <option value="Pending" selected>Pending</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Completed">Completed</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="dueDate" class="form-label fw-medium">Due Date</label>
                                    <input type="date" class="form-control" id="dueDate" 
                                           placeholder="mm/dd/yyyy" required>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-medium">Description</label>
                                <textarea class="form-control" id="description" rows="5" 
                                          placeholder="Add details about this task..."></textarea>
                            </div>

                            <!-- Form Actions -->
                            <div class="d-flex gap-2 justify-content-end">
                                <button type="button" class="btn btn-outline-secondary px-4" onclick="window.history.back()">
                                    Cancel
                                </button>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-2"></i>Save Task
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <!-- Create Task Script -->
    <script src="../assets/js/create-task.js"></script>
</body>
</html>
