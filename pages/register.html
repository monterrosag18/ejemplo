<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- Registro de usuarios - CRUDZASO -->
</head>
<body class="auth-page">
    <!-- Main Container -->
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center" style="background: #f5f7fb;">
        <!-- Register Card -->
        <div class="card shadow-sm border-0" style="max-width: 480px; width: 100%; border-radius: 16px;">
            <div class="card-body p-5">
                <!-- Logo Section -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; background: #3b4351; border-radius: 16px;">
                        <i class="bi bi-bookmark-fill text-white" style="font-size: 2rem;"></i>
                    </div>
                    <h1 class="fw-bold fs-3 mb-0">CRUDZASO</h1>
                </div>

                <!-- Welcome Text -->
                <div class="text-center mb-4">
                    <h2 class="h4 fw-semibold mb-2">Create account</h2>
                    <p class="text-muted small">Join the academic performance platform today</p>
                </div>

                <!-- Register Form -->
                <form id="register-form">
                    <!-- Full Name Field -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-medium">Full Name</label>
                        <input type="text" class="form-control" id="fullName" 
                               placeholder="John Doe" required>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email address</label>
                        <input type="email" class="form-control" id="email" 
                               placeholder="student@university.edu" required>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="password" 
                               placeholder="Create a password" required>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" 
                               placeholder="Confirm password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 mb-3" style="background: #2563eb; border: none; padding: 12px;">
                        Register
                    </button>

                    <!-- Login Link -->
                    <div class="text-center">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="../index.html" class="text-decoration-none fw-medium ms-1">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <!-- Register Script -->
    <script src="../assets/js/register.js"></script>
</body>
</html>
